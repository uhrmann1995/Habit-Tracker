<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Standard">
<meta name="theme-color" content="#0C1220">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230C1220'/%3E%3Cpath d='M52 92l24 24 52-52' stroke='%23E03131' stroke-width='14' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Standard</title>
<style>
  :root{
    --ink:#0C1220; --panel:#141C2E; --panel-2:#1A2440; --rule:#243252;
    --white:#FFFFFF; --muted:#8494AC; --dim:#5C6B85;
    --red:#E03131; --red-soft:#B02525; --blue:#4C8DFF;
    --radius:12px; --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--white)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea,select{font:inherit;color:var(--white);background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;width:100%}
  input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  ::placeholder{color:var(--dim)}
  .wrap{max-width:520px;margin:0 auto;padding:0 14px}

  header{padding-top:calc(10px + env(safe-area-inset-top));background:var(--ink);position:sticky;top:0;z-index:20;border-bottom:1px solid var(--rule)}
  .brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 12px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--red);display:grid;place-items:center;flex:none}
  .mark svg{width:17px;height:17px}
  .brandname{font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none}
  .iconbtn:active{background:var(--panel)}
  .iconbtn svg{width:21px;height:21px}

  .weeknav{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
  .weeknav .label{text-align:center;flex:1;min-width:0}
  .weeknav .range{font-size:15px;font-weight:600}
  .weeknav .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .weeknav .sub.live{color:var(--blue)}
  .arrow{width:38px;height:38px;display:grid;place-items:center;border-radius:9px;background:var(--panel);flex:none}
  .arrow:active{background:var(--panel-2)}
  .arrow svg{width:16px;height:16px}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border-radius:10px;padding:4px;margin-bottom:12px}
  .tab{height:36px;border-radius:7px;font-size:14.5px;font-weight:600;color:var(--muted);display:grid;place-items:center}
  .tab[aria-selected="true"]{background:var(--red);color:var(--white)}

  .card{background:var(--panel);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
  .sectionhead{padding:11px 14px 9px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--panel-2);border-bottom:1px solid var(--rule)}

  .daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
  .day{padding:8px 0;border-radius:9px;background:var(--panel);text-align:center;line-height:1.25}
  .day .d{font-size:11px;color:var(--muted)}
  .day .n{font-size:16px;font-weight:600;margin-top:2px}
  .day[data-sel="1"]{background:var(--red)}
  .day[data-sel="1"] .d{color:rgba(255,255,255,.85)}
  .day[data-today="1"]:not([data-sel="1"]) .n{color:var(--blue)}
  .day .dot{width:4px;height:4px;border-radius:50%;background:var(--dim);margin:4px auto 0}
  .day .dot.full{background:var(--blue)}
  .day[data-sel="1"] .dot{background:rgba(255,255,255,.9)}

  .summary{display:flex;align-items:center;gap:12px;padding:14px;background:var(--panel);border-radius:var(--radius);margin-bottom:12px}
  .ring{position:relative;width:52px;height:52px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700}
  .summary .big{font-size:16px;font-weight:600}
  .summary .small{font-size:13px;color:var(--muted);margin-top:2px}

  .row{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--rule);min-height:var(--tap);text-align:left;width:100%}
  .row:last-child{border-bottom:0}
  .row .meta{flex:1;min-width:0;cursor:pointer}
  .row .nm{font-size:15.5px;font-weight:600;line-height:1.25;display:block}
  .row .tg{font-size:12.5px;color:var(--muted);margin-top:2px;display:block}
  .row[data-done="1"] .nm{color:var(--muted)}
  .wkcol{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;min-width:40px}
  .wk{font-size:12.5px;color:var(--dim);flex:none;font-weight:600}
  .wk.met{color:var(--blue)}
  .streak{font-size:11px;font-weight:700;color:var(--red);line-height:1.2}
  .streak.alt{color:var(--dim);font-weight:600}
  .goalhead .dt{color:var(--blue)}

  .boxes{display:flex;align-items:center;gap:5px;flex:none}
  .box{width:26px;height:26px;border-radius:7px;border:2px solid var(--rule);flex:none;display:grid;place-items:center;background:none}
  .box svg{width:14px;height:14px}
  .box.on{background:var(--red);border-color:var(--red)}
  .box.ghost{border-style:dashed;border-color:#31405F}
  .box.ghost svg{display:none}
  .box.ghost::after{content:"+";color:#47587A;font-size:17px;font-weight:600;line-height:1}
  .chip{height:26px;padding:0 8px;border-radius:7px;background:var(--red);color:#fff;font-size:12.5px;font-weight:700;display:grid;place-items:center;flex:none}

  .grid{width:100%;border-collapse:collapse}
  .grid th,.grid td{padding:0;text-align:center}
  .grid thead th{font-size:11px;font-weight:600;color:var(--muted);padding:9px 0;background:var(--panel-2);border-bottom:1px solid var(--rule)}
  .grid thead th.h-habit{text-align:left;padding-left:14px}
  .grid thead th .dn{display:block;font-size:13px;color:var(--white);font-weight:600}
  .grid thead th[data-today="1"] .dn{color:var(--blue)}
  .grid td.c-habit{text-align:left;padding:9px 6px 9px 14px}
  .grid tbody tr{border-bottom:1px solid var(--rule)}
  .grid tbody tr:last-child{border-bottom:0}
  .grid .nm{font-size:14px;font-weight:600;line-height:1.2}
  .grid .tg{font-size:11.5px;color:var(--muted);margin-top:2px}
  .grid td.c-wk{padding-right:12px;font-size:12.5px;font-weight:600;color:var(--dim)}
  .grid td.c-wk.met{color:var(--blue)}
  .cell{width:100%;height:38px;display:grid;place-items:center;position:relative}
  .cell .mini{width:22px;height:22px;border-radius:6px;border:2px solid var(--rule);display:grid;place-items:center}
  .cell .mini svg{width:12px;height:12px;opacity:0}
  .cell[data-on="1"] .mini{background:var(--red);border-color:var(--red)}
  .cell[data-on="1"] .mini svg{opacity:1}
  .cell .n{position:absolute;top:3px;right:calc(50% - 17px);background:var(--blue);color:#fff;font-size:9.5px;font-weight:700;line-height:1;padding:2px 3.5px;border-radius:5px}
  td[data-today="1"]{background:rgba(76,141,255,.07)}
  .sectionrow td{background:var(--panel-2);padding:9px 14px;text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--rule)}

  .noteblock{padding:14px}
  .notelabel{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .notelabel .hint{font-size:12px;color:var(--dim);font-weight:400}
  textarea{min-height:110px;resize:vertical;line-height:1.5}
  .daynote{border-bottom:1px solid var(--rule)}
  .daynote:last-child{border-bottom:0}
  .dnhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;width:100%;text-align:left;gap:10px}
  .dnhead .dt{font-size:14.5px;font-weight:600;flex:none}
  .dnhead .pv{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
  .dnhead .pv.empty{color:var(--dim)}
  .dnbody{padding:0 14px 14px}

  .sheet{position:fixed;inset:0;background:var(--ink);z-index:50;overflow-y:auto;display:none}
  .sheet.open{display:block}
  .sheethead{position:sticky;top:0;background:var(--ink);border-bottom:1px solid var(--rule);z-index:2;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px}
  .sheethead h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
  .done{color:var(--blue);font-weight:600;font-size:15.5px;padding:10px 4px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .hrow{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--rule)}
  .hrow:last-child{border-bottom:0}
  .hrow .meta{flex:1;min-width:0}
  .hrow .nm{font-size:14.5px;font-weight:600}
  .hrow .tg{font-size:12px;color:var(--muted);margin-top:1px}
  .mini-btn{width:32px;height:32px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center;color:var(--muted);flex:none}
  .mini-btn:active{background:var(--rule)}
  .mini-btn svg{width:15px;height:15px}
  .btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;font-weight:600;font-size:15px;margin-top:10px}
  .btn.primary{background:var(--red);color:#fff}
  .btn.ghost{background:var(--panel)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red-soft)}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5}
  .banner{background:#2A1418;border:1px solid var(--red-soft);border-radius:var(--radius);padding:11px 13px;margin-bottom:12px;font-size:13px;line-height:1.5;color:#FFC9CC}
  .banner strong{color:#fff}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--panel-2);border:1px solid var(--rule);color:var(--white);font-size:13.5px;padding:10px 16px;border-radius:999px;z-index:80;display:none}
  .toast.show{display:block}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brandrow">
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg></div>
        <div class="brandname" id="brandname">Standard</div>
      </div>
      <button class="iconbtn" id="openSettings" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    <div class="weeknav">
      <button class="arrow" id="prevWeek" aria-label="Previous week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="label" id="weekLabel"><div class="range" id="weekRange">—</div><div class="sub" id="weekSub">—</div></button>
      <button class="arrow" id="nextWeek" aria-label="Next week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
      <button class="tab" role="tab" data-tab="week" aria-selected="false">Week</button>
      <button class="tab" role="tab" data-tab="notes" aria-selected="false">Notes</button>
    </div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="sheet" id="settings"><div class="wrap">
  <div class="sheethead"><h2>Settings</h2><button class="done" id="closeSettings">Done</button></div>
  <div id="settingsBody" style="padding:14px 0 40px"></div>
</div></div>

<div class="sheet" id="editor"><div class="wrap">
  <div class="sheethead"><h2 id="editorTitle">Edit habit</h2><button class="done" id="closeEditor">Cancel</button></div>
  <div id="editorBody" style="padding:14px 0 40px"></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ===== Storage: probe every backend, fall back gracefully ===== */
const KEY = "standard.v1";
const PROBE = "standard.probe";

let backend = { name:"memory", label:"Not saving", detail:"This preview blocks storage. Copy a backup before you close it." };

async function probeStorage(){
  // 1. Claude artifact storage
  if(window.storage && typeof window.storage.set === "function"){
    try{
      await window.storage.set(PROBE, "1");
      const r = await window.storage.get(PROBE);
      if(r && r.value === "1"){
        try{ await window.storage.delete(PROBE); }catch(e){}
        return { name:"claude", label:"Saving to Claude storage", detail:"Persists across your sessions here." };
      }
    }catch(e){}
  }
  // 2 & 3. Web storage
  const webs = [
    ["local",   ()=>window.localStorage,   "Saving to this device", "Stays until you clear Safari data."],
    ["session", ()=>window.sessionStorage, "Saving to this tab",    "Lost when the tab closes. Copy a backup."]
  ];
  for(const [name, get, label, detail] of webs){
    try{
      const st = get();
      st.setItem(PROBE, "1");
      if(st.getItem(PROBE) === "1"){ st.removeItem(PROBE); return { name, label, detail, store:st }; }
    }catch(e){}
  }
  // 4. Memory only
  return { name:"memory", label:"Not saving", detail:"This preview blocks storage. Copy a backup before you close it." };
}

const store = {
  async load(){
    try{
      if(backend.name === "claude"){
        const r = await window.storage.get(KEY);
        return r ? JSON.parse(r.value) : null;
      }
      if(backend.store){
        const raw = backend.store.getItem(KEY);
        return raw ? JSON.parse(raw) : null;
      }
    }catch(e){}
    return null;
  },
  async save(v){
    const json = JSON.stringify(v);
    try{
      if(backend.name === "claude"){ await window.storage.set(KEY, json); return true; }
      if(backend.store){ backend.store.setItem(KEY, json); return true; }
    }catch(e){ return false; }
    return false;
  }
};

/* ===== Model ===== */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAYS1 = ["M","T","W","T","F","S","S"];
function uid(){ return Math.random().toString(36).slice(2,10); }

function seed(){
  const mk = (name,target,section,goal)=>({id:uid(),name,target,section,goal});
  return {
    title:"Standard",
    sections:["Non-negotiables","The stack"],
    habits:[
      mk("Daily 10","10 minutes","Non-negotiables",7),
      mk("Mobility","5 minutes","Non-negotiables",7),
      mk("Mindfulness","5 minutes","Non-negotiables",7),
      mk("Reading","10 minutes","Non-negotiables",7),
      mk("Gratitude","5 minutes","Non-negotiables",7),
      mk("Push-ups","25 reps","The stack",7),
      mk("Step floor","7,500 steps","The stack",5),
      mk("Hydration","80 oz","The stack",5),
      mk("Strength","Full session","The stack",3),
      mk("Zone 2 cardio","25–35 minutes","The stack",2),
      mk("Journaling","10 minutes","The stack",5),
      mk("Sleep window","Consistent","The stack",5)
    ],
    entries:{}, dayNotes:{}, weekNotes:{}, goals:""
  };
}

let S = seed();
let saveWarned = false;
let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(backend.name === "memory") return;   // status is shown in the banner instead
    const ok = await store.save(S);
    if(!ok && !saveWarned){ saveWarned = true; toast("That change couldn't be saved"); }
  }, 150);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ===== Dates ===== */
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; }
function fmtShort(d){ return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); }
function fmtLong(d){ return d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}); }

const TODAY_ISO = iso(new Date());
let weekStart = mondayOf(new Date());
let selectedDate = TODAY_ISO;
let activeTab = "today";
let openNote = null;
let openGoals = false;

/* ===== Counts (0 = not done, 1+ = number of times) ===== */
function count(hid,d){ const v = S.entries[hid+"|"+d]; return v===true ? 1 : (typeof v==="number" ? v : 0); }
function setCount(hid,d,n){
  const k = hid+"|"+d;
  if(n<=0) delete S.entries[k]; else S.entries[k]=n;
  save();
}
function bump(hid,d,delta){ setCount(hid,d,count(hid,d)+delta); }

function weekDates(){ return Array.from({length:7},(_,i)=>iso(addDays(weekStart,i))); }
function weekDays(hid){ return weekDates().filter(d=>count(hid,d)>0).length; }
function weekTotal(hid){ return weekDates().reduce((a,d)=>a+count(hid,d),0); }
function dayStats(d){
  const total = S.habits.length;
  const done = S.habits.filter(h=>count(h.id,d)>0).length;
  const checks = S.habits.reduce((a,h)=>a+count(h.id,d),0);
  return {done,total,checks};
}
/* ===== Streaks =====
   Goal of 7 days a week is judged daily. Anything less is judged by the week,
   so a 3x-a-week habit doesn't break its streak on an off day. */
function daysInWeekOf(hid,monday){
  let c=0; for(let i=0;i<7;i++) if(count(hid,iso(addDays(monday,i)))>0) c++;
  return c;
}
/* Day streak. With grace, one missed day is absorbed and only two misses
   back to back end the run — a single off day isn't a collapse, and a strict
   rule zeroes out people holding 80%+ adherence. Missed days don't count. */
function dayStreak(hid, grace){
  let d = new Date(); d.setHours(0,0,0,0);
  if(count(hid,iso(d))===0) d = addDays(d,-1);   // today still pending, don't break it
  let n=0, misses=0, guard=0;
  while(guard++ < 3000){
    if(count(hid,iso(d))>0){ n++; misses=0; }
    else { misses++; if(misses > (grace?1:0)) break; }
    d = addDays(d,-1);
  }
  return n;
}
function weekStreak(hid,goal){
  let m = mondayOf(new Date());
  if(daysInWeekOf(hid,m) < goal) m = addDays(m,-7); // this week still in progress
  let n=0;
  while(daysInWeekOf(hid,m) >= goal && n<600){ n++; m = addDays(m,-7); }
  return n;
}
function streakOf(hb){
  return hb.goal>=7
    ? {n:dayStreak(hb.id,true), unit:"d"}          // daily habit, one grace day
    : {n:weekStreak(hb.id,hb.goal), unit:"w"};     // few-times-a-week habit, judged weekly
}
function bestDayStreak(hid){
  const ds = Object.keys(S.entries)
    .filter(k=>k.startsWith(hid+"|"))
    .map(k=>k.split("|")[1]).sort();
  let best=0,cur=0,prev=null;
  ds.forEach(d=>{
    cur = (prev && iso(addDays(parseISO(prev),1))===d) ? cur+1 : 1;
    if(cur>best) best=cur;
    prev=d;
  });
  return best;
}

function orderedSections(){
  const seen=[]; S.habits.forEach(h=>{ if(!seen.includes(h.section)) seen.push(h.section); });
  const out = S.sections.filter(s=>seen.includes(s));
  seen.forEach(s=>{ if(!out.includes(s)) out.push(s); });
  return out;
}
function habitsIn(s){ return S.habits.filter(h=>h.section===s); }
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';

/* ===== Header ===== */
function renderHeader(){
  document.getElementById("brandname").textContent = S.title || "Standard";
  document.getElementById("weekRange").textContent = fmtShort(weekStart)+" – "+fmtShort(addDays(weekStart,6));
  const diff = Math.round((weekStart - mondayOf(new Date()))/604800000);
  const sub = document.getElementById("weekSub");
  sub.textContent = diff===0?"This week":diff===-1?"Last week":diff===1?"Next week":diff<0?Math.abs(diff)+" weeks back":diff+" weeks ahead";
  sub.className = diff===0 ? "sub live" : "sub";
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab===activeTab)));
}

/* ===== Today ===== */
function boxesHTML(hid,n){
  let h = '<span class="boxes">';
  if(n<=3){
    for(let i=1;i<=n;i++){
      h += `<button class="box on" data-set="${hid}|${i-1}" aria-label="Set to ${i-1}">${CHECK}</button>`;
    }
  }else{
    h += `<button class="box on" data-set="${hid}|${n-1}" aria-label="Remove one">${CHECK}</button>`;
    h += `<span class="chip">×${n}</span>`;
  }
  h += `<button class="box ghost" data-inc="${hid}" aria-label="Add one">${CHECK}</button>`;
  return h+'</span>';
}

function viewToday(){
  const dates = weekDates();
  if(!dates.includes(selectedDate)) selectedDate = dates.includes(TODAY_ISO)?TODAY_ISO:dates[0];

  let h = '<div class="daystrip">';
  dates.forEach((d,i)=>{
    const st = dayStats(d);
    h += `<button class="day" data-day="${d}" data-sel="${d===selectedDate?1:0}" data-today="${d===TODAY_ISO?1:0}">
      <div class="d">${DAYS1[i]}</div><div class="n">${parseISO(d).getDate()}</div>
      <div class="dot ${st.total&&st.done===st.total?"full":""}"></div></button>`;
  });
  h += '</div>';

  const st = dayStats(selectedDate);
  const pct = st.total?Math.round(st.done/st.total*100):0;
  const C = 2*Math.PI*22;
  h += `<div class="summary">
    <div class="ring"><svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="22" stroke="var(--rule)" stroke-width="5" fill="none"/>
      <circle cx="26" cy="26" r="22" stroke="${pct===100?"var(--blue)":"var(--red)"}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/>
    </svg><div class="pct">${pct}</div></div>
    <div><div class="big">${fmtLong(parseISO(selectedDate))}</div>
    <div class="small">${st.done} of ${st.total} done${st.checks>st.done?" · "+st.checks+" check-ins":""}</div></div></div>`;

  if(!S.habits.length) return h+`<div class="card"><div class="empty">No habits yet.<br>Open settings to add your first one.</div></div>`;

  orderedSections().forEach(sec=>{
    h += `<div class="card"><div class="sectionhead">${esc(sec)}</div>`;
    habitsIn(sec).forEach(hb=>{
      const n = count(hb.id,selectedDate);
      const days = weekDays(hb.id), tot = weekTotal(hb.id);
      const met = days>=hb.goal;
      const st2 = streakOf(hb);
      const sub = st2.n>=2 ? `<span class="streak">${st2.n}${st2.unit}</span>`
                : (tot>days ? `<span class="streak alt">${tot}×</span>` : "");
      h += `<div class="row" data-done="${n>0?1:0}">
        ${boxesHTML(hb.id,n)}
        <span class="meta" data-inc="${hb.id}">
          <span class="nm">${esc(hb.name)}</span>
          ${hb.target?`<span class="tg">${esc(hb.target)}${n>1?" · "+n+"× today":""}</span>`:(n>1?`<span class="tg">${n}× today</span>`:"")}
        </span>
        <span class="wkcol">
          <span class="wk ${met?"met":""}">${days}/${hb.goal}</span>${sub}
        </span>
      </div>`;
    });
    h += `</div>`;
  });
  return h;
}

/* ===== Week ===== */
function viewWeek(){
  if(!S.habits.length) return `<div class="card"><div class="empty">No habits yet.<br>Open settings to add your first one.</div></div>`;
  const dates = weekDates();
  let h = `<div class="card"><table class="grid"><thead><tr><th class="h-habit">Habit</th>`;
  dates.forEach((d,i)=>{ h += `<th data-today="${d===TODAY_ISO?1:0}">${DAYS1[i]}<span class="dn">${parseISO(d).getDate()}</span></th>`; });
  h += `<th>Wk</th></tr></thead><tbody>`;

  orderedSections().forEach(sec=>{
    h += `<tr class="sectionrow"><td colspan="9">${esc(sec)}</td></tr>`;
    habitsIn(sec).forEach(hb=>{
      const days = weekDays(hb.id), tot = weekTotal(hb.id), met = days>=hb.goal;
      h += `<tr><td class="c-habit"><div class="nm">${esc(hb.name)}</div>${hb.target?`<div class="tg">${esc(hb.target)}</div>`:""}</td>`;
      dates.forEach(d=>{
        const n = count(hb.id,d);
        h += `<td data-today="${d===TODAY_ISO?1:0}"><button class="cell" data-cell="${hb.id}|${d}" data-on="${n>0?1:0}" aria-label="${esc(hb.name)} ${d}, ${n} times">
          <span class="mini">${CHECK}</span>${n>1?`<span class="n">${n}</span>`:""}</button></td>`;
      });
      const stk = streakOf(hb);
      const wsub = stk.n>=2 ? `<div class="streak">${stk.n}${stk.unit}</div>`
                 : (tot>days ? `<div class="streak alt">${tot}×</div>` : "");
      h += `<td class="c-wk ${met?"met":""}">${days}/${hb.goal}${wsub}</td></tr>`;
    });
  });
  return h+`</tbody></table></div>
  <div style="font-size:12.5px;color:var(--dim);padding:0 4px 8px;line-height:1.5">Tap a square to add one. Tap again on a filled square to clear the day. Use Today to fine-tune repeats.</div>`;
}

/* ===== Notes ===== */
function viewNotes(){
  const wk = iso(weekStart);
  let h = `<div class="card"><div class="noteblock">
    <div class="notelabel"><span>This week</span><span class="hint">${fmtShort(weekStart)} – ${fmtShort(addDays(weekStart,6))}</span></div>
    <textarea id="weekNote" placeholder="What are you holding yourself to this week?">${esc(S.weekNotes[wk]||"")}</textarea></div></div><div class="card">`;
  weekDates().forEach((d,i)=>{
    const val = S.dayNotes[d]||"";
    const open = openNote===d;
    h += `<div class="daynote">
      <button class="dnhead" data-note="${d}">
        <span class="dt">${DAYS[i]} ${parseISO(d).getDate()}</span>
        <span class="pv ${val?"":"empty"}">${esc(val?val.replace(/\s+/g," ").slice(0,60):"Add a note")}</span>
      </button>
      ${open?`<div class="dnbody"><textarea data-daynote="${d}" placeholder="How did the day actually go?">${esc(val)}</textarea></div>`:""}</div>`;
  });
  h += `</div>`;

  const g = S.goals||"";
  h += `<div class="card">
    <button class="dnhead goalhead" data-goals="1">
      <span class="dt">Ideal goals</span>
      <span class="pv ${g?"":"empty"}">${esc(g?g.replace(/\s+/g," ").slice(0,50):"Where this is all going")}</span>
    </button>
    ${openGoals?`<div class="dnbody">
      <textarea id="goalsNote" style="min-height:200px" placeholder="The version of you this is building toward. Not a weekly target — the thing the daily reps add up to.">${esc(g)}</textarea>
      <div style="font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.5">Stays put no matter which week you're viewing.</div>
    </div>`:""}
  </div>`;
  return h;
}

/* ===== Render ===== */
function render(){
  renderHeader();
  const m = document.getElementById("main");
  const warn = backend.name==="memory"
    ? `<div class="banner"><strong>Nothing is being saved.</strong> This preview blocks storage, so your check-ins disappear on reload. Open Settings and use Copy backup, or host the file to make it stick.</div>`
    : backend.name==="session"
    ? `<div class="banner"><strong>Saving to this tab only.</strong> Close it and the data is gone. Copy a backup from Settings.</div>`
    : "";
  m.innerHTML = warn + (activeTab==="today"?viewToday():activeTab==="week"?viewWeek():viewNotes());
  if(activeTab==="notes"){
    const ta = openGoals ? m.querySelector("#goalsNote")
             : openNote ? m.querySelector(`textarea[data-daynote="${openNote}"]`) : null;
    if(ta){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); }
  }
}

/* ===== Events ===== */
document.getElementById("prevWeek").onclick = ()=>{ weekStart=addDays(weekStart,-7); openNote=null; render(); };
document.getElementById("nextWeek").onclick = ()=>{ weekStart=addDays(weekStart,7); openNote=null; render(); };
document.getElementById("weekLabel").onclick = ()=>{ weekStart=mondayOf(new Date()); selectedDate=TODAY_ISO; openNote=null; render(); };
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{ activeTab=t.dataset.tab; openNote=null; render(); });

document.getElementById("main").addEventListener("click",e=>{
  const day = e.target.closest("[data-day]");
  if(day){ selectedDate=day.dataset.day; render(); return; }

  const inc = e.target.closest("[data-inc]");
  if(inc){ bump(inc.dataset.inc, selectedDate, 1); render(); return; }

  const set = e.target.closest("[data-set]");
  if(set){ const [hid,n]=set.dataset.set.split("|"); setCount(hid,selectedDate,+n); render(); return; }

  const cell = e.target.closest("[data-cell]");
  if(cell){
    const [hid,d]=cell.dataset.cell.split("|");
    setCount(hid,d, count(hid,d)>0 ? 0 : 1);
    render(); return;
  }

  if(e.target.closest("[data-goals]")){ openGoals = !openGoals; render(); return; }

  const note = e.target.closest("[data-note]");
  if(note){ openNote = openNote===note.dataset.note?null:note.dataset.note; render(); }
});

document.getElementById("main").addEventListener("input",e=>{
  if(e.target.id==="goalsNote"){ S.goals = e.target.value; save(); return; }
  if(e.target.id==="weekNote"){
    const wk = iso(weekStart);
    if(e.target.value.trim()) S.weekNotes[wk]=e.target.value; else delete S.weekNotes[wk];
    save(); return;
  }
  const d = e.target.dataset.daynote;
  if(d){ if(e.target.value.trim()) S.dayNotes[d]=e.target.value; else delete S.dayNotes[d]; save(); }
});

let tx=0,ty=0;
document.addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
document.addEventListener("touchend",e=>{
  if(document.querySelector(".sheet.open")) return;
  if(e.target.closest("textarea,input")) return;
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*2){ weekStart=addDays(weekStart,dx<0?7:-7); openNote=null; render(); }
},{passive:true});

/* ===== Settings ===== */
const settings = document.getElementById("settings");
const settingsBody = document.getElementById("settingsBody");
document.getElementById("openSettings").onclick = ()=>{ renderSettings(); settings.classList.add("open"); };
document.getElementById("closeSettings").onclick = ()=>{ settings.classList.remove("open"); render(); };

const UP='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>';
const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

function renderSettings(){
  let h = `<div class="field"><label for="titleInput">App name</label>
    <input id="titleInput" value="${esc(S.title||"")}" placeholder="Standard"></div>
    <div style="font-size:13px;color:var(--muted);margin:22px 0 8px">Habits</div><div class="card">`;
  if(!S.habits.length) h += `<div class="empty">Nothing here yet. Add a habit below.</div>`;
  else S.habits.forEach((hb,i)=>{
    h += `<div class="hrow"><div class="meta"><div class="nm">${esc(hb.name)}</div>
      <div class="tg">${esc(hb.section)} · ${hb.goal}× a week${hb.target?" · "+esc(hb.target):""}</div></div>
      <button class="mini-btn" data-up="${i}" ${i===0?"disabled style=opacity:.3":""} aria-label="Move up">${UP}</button>
      <button class="mini-btn" data-down="${i}" ${i===S.habits.length-1?"disabled style=opacity:.3":""} aria-label="Move down">${DOWN}</button>
      <button class="mini-btn" data-edit="${hb.id}" aria-label="Edit">${PEN}</button></div>`;
  });
  h += `</div><button class="btn primary" id="addHabit">Add a habit</button>
    <div style="font-size:13px;color:var(--muted);margin:26px 0 8px">Your data</div>
    <div class="card" style="padding:12px 14px;font-size:13.5px;line-height:1.6">
      <strong style="color:${backend.name==="memory"||backend.name==="session"?"var(--red)":"var(--blue)"}">${backend.label}</strong>
      <div style="color:var(--muted);font-size:12.5px;margin-top:3px">${backend.detail}</div>
    </div>
    <div class="split">
      <button class="btn ghost" id="copyData" style="margin-top:0">Copy backup</button>
      <button class="btn ghost" id="pasteData" style="margin-top:0">Paste backup</button>
    </div>
    <div class="split" style="margin-top:10px">
      <button class="btn ghost" id="exportData" style="margin-top:0">Download file</button>
      <button class="btn ghost" id="importData" style="margin-top:0">Open file</button>
    </div>
    <div id="pasteWrap" style="display:none;margin-top:10px">
      <textarea id="pasteBox" placeholder="Paste your backup text here, then tap Restore"></textarea>
      <button class="btn primary" id="doRestore">Restore from text</button>
    </div>
    <button class="btn danger" id="resetData">Erase everything</button>
    <div style="font-size:12.5px;color:var(--dim);margin-top:14px;line-height:1.5">
      Copy backup puts everything on your clipboard as text — paste it into Notes or a message to yourself. It works even where file downloads are blocked.
    </div>`;
  settingsBody.innerHTML = h;

  document.getElementById("titleInput").oninput = e=>{ S.title=e.target.value; save(); renderHeader(); };
  document.getElementById("addHabit").onclick = ()=>openEditor(null);
  document.getElementById("exportData").onclick = exportData;
  document.getElementById("importData").onclick = importData;
  document.getElementById("copyData").onclick = copyData;
  document.getElementById("pasteData").onclick = ()=>{
    const w = document.getElementById("pasteWrap");
    w.style.display = w.style.display==="none" ? "block" : "none";
    if(w.style.display==="block") document.getElementById("pasteBox").focus();
  };
  document.getElementById("doRestore").onclick = ()=>{
    const txt = document.getElementById("pasteBox").value.trim();
    if(!txt){ toast("Paste your backup text first"); return; }
    applyBackup(txt);
  };
  const rst = document.getElementById("resetData");
  let rArmed = false, rT = null;
  rst.onclick = ()=>{
    if(!rArmed){
      rArmed = true;
      rst.textContent = "Tap again to erase everything";
      rst.style.background = "var(--red)"; rst.style.color = "#fff";
      rT = setTimeout(()=>{
        rArmed = false;
        rst.textContent = "Erase everything";
        rst.style.background = "transparent"; rst.style.color = "var(--red)";
      }, 6000);
      return;
    }
    clearTimeout(rT);
    S = seed(); save(); renderSettings(); render(); toast("Everything erased");
  };
  settingsBody.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [S.habits[i-1],S.habits[i]]=[S.habits[i],S.habits[i-1]]; save(); renderSettings(); });
  settingsBody.querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>{ const i=+b.dataset.down; [S.habits[i+1],S.habits[i]]=[S.habits[i],S.habits[i+1]]; save(); renderSettings(); });
  settingsBody.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditor(b.dataset.edit));
}

function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "standard-backup-"+TODAY_ISO+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function copyData(){
  const json = JSON.stringify(S);
  const done = ()=>toast("Backup copied — paste it somewhere safe");
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(done).catch(()=>legacyCopy(json,done));
  }else legacyCopy(json,done);
}
function legacyCopy(text,done){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(e){}
  ta.remove();
  if(ok) done();
  else toast("Copy blocked — use Download file instead");
}
function applyBackup(text){
  try{
    const d = JSON.parse(text);
    if(!d || !Array.isArray(d.habits)) throw 0;
    S = Object.assign(seed(), d);
    save(); renderSettings(); render(); toast("Backup restored");
  }catch(e){ toast("That text isn't a Standard backup"); }
}
function importData(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange = ()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>applyBackup(r.result);
    r.readAsText(f);
  };
  inp.click();
}

/* ===== Habit editor ===== */
const editor = document.getElementById("editor");
const editorBody = document.getElementById("editorBody");
document.getElementById("closeEditor").onclick = ()=>editor.classList.remove("open");

function openEditor(id){
  const hb = id ? S.habits.find(x=>x.id===id) : {name:"",target:"",section:orderedSections()[0]||S.sections[0],goal:7};
  document.getElementById("editorTitle").textContent = id?"Edit habit":"New habit";
  const secs = Array.from(new Set([...S.sections, ...S.habits.map(x=>x.section)]));
  let stats = "";
  if(id){
    const s = streakOf(hb);
    const best = bestDayStreak(id);
    const all = Object.keys(S.entries).filter(k=>k.startsWith(id+"|"))
      .reduce((a,k)=>a+(S.entries[k]===true?1:S.entries[k]),0);
    const cur = dayStreak(id,false);
    stats = `<div class="card" style="padding:12px 14px;font-size:13.5px;line-height:1.8;color:var(--muted)">
      Streak <strong style="color:var(--red)">${s.n} ${s.unit==="d"?(s.n===1?"day":"days"):(s.n===1?"week":"weeks")}</strong>${s.unit==="w"?` hitting ${hb.goal}× or better`:" (one grace day allowed)"}<br>
      Perfect run right now <strong style="color:var(--white)">${cur} ${cur===1?"day":"days"}</strong><br>
      Longest run of days <strong style="color:var(--white)">${best}</strong><br>
      Logged all time <strong style="color:var(--white)">${all}×</strong></div>`;
  }
  editorBody.innerHTML = stats + `
    <div class="field"><label for="eName">Name</label><input id="eName" value="${esc(hb.name)}" placeholder="Push-ups"></div>
    <div class="field"><label for="eTarget">Target <span style="color:var(--dim)">(optional)</span></label><input id="eTarget" value="${esc(hb.target)}" placeholder="25 reps"></div>
    <div class="field"><label for="eSection">Group</label><select id="eSection">
      ${secs.map(s=>`<option ${s===hb.section?"selected":""}>${esc(s)}</option>`).join("")}
      <option value="__new">Create a new group…</option></select></div>
    <div class="field" id="newSecWrap" style="display:none"><label for="eNewSec">New group name</label><input id="eNewSec" placeholder="Recovery"></div>
    <div class="field"><label for="eGoal">Days per week: <span id="goalVal">${hb.goal}</span></label>
      <input type="range" id="eGoal" min="1" max="7" value="${hb.goal}" style="padding:0;background:none;border:0"></div>
    <button class="btn primary" id="saveHabit">${id?"Save changes":"Add habit"}</button>
    ${id?`<button class="btn danger" id="deleteHabit">Delete habit</button>`:""}`;

  const sel = document.getElementById("eSection");
  sel.onchange = ()=>{ document.getElementById("newSecWrap").style.display = sel.value==="__new"?"block":"none"; };
  const g = document.getElementById("eGoal");
  g.oninput = ()=>{ document.getElementById("goalVal").textContent = g.value; };

  document.getElementById("saveHabit").onclick = ()=>{
    const name = document.getElementById("eName").value.trim();
    if(!name){ toast("Give the habit a name"); return; }
    let section = sel.value;
    if(section==="__new"){
      section = document.getElementById("eNewSec").value.trim();
      if(!section){ toast("Name the new group"); return; }
      if(!S.sections.includes(section)) S.sections.push(section);
    }
    const data = {name, target:document.getElementById("eTarget").value.trim(), section, goal:+g.value};
    if(id) Object.assign(S.habits.find(x=>x.id===id), data);
    else S.habits.push(Object.assign({id:uid()}, data));
    save(); editor.classList.remove("open"); renderSettings(); render();
  };
  if(id){
    const del = document.getElementById("deleteHabit");
    let armed = false, t = null;
    del.onclick = ()=>{
      if(!armed){
        armed = true;
        del.textContent = "Tap again to delete permanently";
        del.style.background = "var(--red)";
        del.style.color = "#fff";
        t = setTimeout(()=>{
          armed = false;
          del.textContent = "Delete habit";
          del.style.background = "transparent";
          del.style.color = "var(--red)";
        }, 6000);
        return;
      }
      clearTimeout(t);
      S.habits = S.habits.filter(x=>x.id!==id);
      Object.keys(S.entries).forEach(k=>{ if(k.startsWith(id+"|")) delete S.entries[k]; });
      save(); editor.classList.remove("open"); renderSettings(); render();
      toast("Habit deleted");
    };
  }
  editor.classList.add("open");
}

/* ===== Boot ===== */
(async function(){
  backend = await probeStorage();
  const loaded = await store.load();
  if(loaded && Array.isArray(loaded.habits)) S = Object.assign(seed(), loaded);
